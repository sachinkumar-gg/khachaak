<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khachaak | Upload Submissions</title>
    <link rel="icon" type="image/png" href="/assets/logos/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .upload-card {
            background: rgba(14, 14, 18, 0.85);
            border: 1px solid rgba(199, 154, 118, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }
        .upload-card img {
            width: 120px;
            margin-bottom: 24px;
        }
        .upload-card h2 {
            font-size: 1.5rem;
            margin: 0 0 12px 0;
            color: #ffffff;
            font-weight: 600;
        }
        .upload-card p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .btn-app {
            display: block;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #c79a76, #a67c52);
            color: #000000;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            box-sizing: border-box;
            margin-bottom: 14px;
            transition: all 0.3s ease;
        }
        .btn-app:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(199, 154, 118, 0.3);
        }
        .btn-web {
            display: inline-block;
            color: rgba(199, 154, 118, 0.9);
            font-size: 0.9rem;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="upload-card">
        <img src="/assets/logos/logo.webp" alt="Khachaak">
        <h2>Opening Google Drive...</h2>
        <p>Redirecting you to the official Khachaak submission folder in the Google Drive app.</p>
        
        <a id="app-link" href="https://drive.google.com/drive/folders/1AQNztInHZikhkKlVFjznOMFN6PBipfDZ" class="btn-app">
            Open in Google Drive App 📱
        </a>
        
        <a href="https://drive.google.com/drive/folders/1AQNztInHZikhkKlVFjznOMFN6PBipfDZ" class="btn-web">
            Continue in Browser
        </a>
    </div>

    <script>
        (function() {
            var folderId = "1AQNztInHZikhkKlVFjznOMFN6PBipfDZ";
            var webUrl = "https://drive.google.com/drive/folders/" + folderId;
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;

            var isAndroid = /android/i.test(userAgent);
            var isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;

            var appLink = document.getElementById("app-link");

            if (isAndroid) {
                var intentUrl = "intent://drive.google.com/drive/folders/" + folderId + "#Intent;scheme=https;package=com.google.android.apps.docs;end";
                if (appLink) appLink.href = intentUrl;
                
                window.location.href = intentUrl;
                setTimeout(function() {
                    window.location.replace(webUrl);
                }, 600);
            } else if (isIOS) {
                var iosScheme = "googledrive://drive.google.com/drive/folders/" + folderId;
                if (appLink) appLink.href = iosScheme;

                window.location.href = iosScheme;
                setTimeout(function() {
                    window.location.replace(webUrl);
                }, 600);
            } else {
                window.location.replace(webUrl);
            }
        })();
    </script>
</body>
</html>
