<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Khachaak | Upload Submissions</title>
    <link rel="icon" type="image/png" href="/assets/logos/favicon.png">
    <link rel="stylesheet" href="/css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body.upload-page {
            background: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
        }

        .upload-portal-card {
            background: rgba(14, 14, 18, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(199, 154, 118, 0.35);
            border-radius: 28px;
            padding: 48px 32px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(199, 154, 118, 0.15);
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .upload-logo {
            width: 140px;
            display: block;
            margin: 0 auto 24px auto;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.5));
        }

        .upload-badge {
            display: inline-block;
            padding: 6px 16px;
            background: rgba(199, 154, 118, 0.12);
            border: 1px solid rgba(199, 154, 118, 0.4);
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--bronze, #c79a76);
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .upload-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.8rem;
            letter-spacing: 0.05em;
            margin: 0 0 12px 0;
            background: linear-gradient(135deg, #ffffff 30%, #c79a76 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }

        .upload-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.92rem;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        .btn-primary-drive {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(135deg, #c79a76 0%, #9e7553 100%);
            color: #000000;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.02em;
            border-radius: 16px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 10px 25px rgba(199, 154, 118, 0.3);
        }

        .btn-primary-drive:hover, .btn-primary-drive:active {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 16px 35px rgba(199, 154, 118, 0.45);
            color: #000000;
        }

        .btn-secondary-web {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 16px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .btn-secondary-web:hover, .btn-secondary-web:active {
            background: rgba(199, 154, 118, 0.15);
            border-color: rgba(199, 154, 118, 0.4);
            color: #ffffff;
            transform: translateY(-2px);
        }

        .exif-chip-row {
            margin-top: 28px;
            display: inline-flex;
            gap: 12px;
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            font-size: 0.72rem;
            color: rgba(199, 154, 118, 0.8);
            font-family: 'Inter', monospace;
        }

        .upload-footer {
            margin-top: 40px;
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.5);
            text-align: center;
            z-index: 10;
        }

        .upload-bg-glow {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(199, 154, 118, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>

<body class="upload-page">

    <!-- Viewfinder Corners -->
    <div class="viewfinder top-left"></div>
    <div class="viewfinder top-right"></div>
    <div class="viewfinder bottom-left"></div>
    <div class="viewfinder bottom-right"></div>

    <div class="upload-bg-glow"></div>

    <div class="upload-portal-card">
        <img src="/assets/logos/logo.webp" alt="Khachaak" class="upload-logo">
        
        <span class="upload-badge">OFFICIAL PORTAL</span>
        <h1 class="upload-title">UPLOAD YOUR FRAMES</h1>
        <p class="upload-subtitle">Submit your photography & media entries directly to the official Khachaak Google Drive repository.</p>

        <div class="btn-group">
            <a id="btn-app" href="https://drive.google.com/drive/folders/1AQNztInHZikhkKlVFjznOMFN6PBipfDZ" class="btn-primary-drive">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                Open Google Drive App
            </a>

            <a id="btn-web" href="https://drive.google.com/drive/folders/1AQNztInHZikhkKlVFjznOMFN6PBipfDZ" target="_blank" class="btn-secondary-web">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                Continue in Browser
            </a>
        </div>

        <div class="exif-chip-row">
            <span>RAW 4K</span> · <span>ISO 100</span> · <span>F/1.4</span>
        </div>
    </div>

    <div class="upload-footer">
        Made with ❤️ by Khachaak Team 2026-27
    </div>

    <script>
        (function() {
            var folderId = "1AQNztInHZikhkKlVFjznOMFN6PBipfDZ";
            var userAgent = navigator.userAgent || navigator.vendor || window.opera;
            var isAndroid = /android/i.test(userAgent);
            var btnApp = document.getElementById("btn-app");

            if (isAndroid && btnApp) {
                btnApp.href = "intent://drive.google.com/drive/folders/" + folderId + "#Intent;scheme=https;package=com.google.android.apps.docs;end";
            }
        })();
    </script>
</body>

</html>
