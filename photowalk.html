<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">

    <title>PhotoWalk 2026 Registration | Khachaak</title>
    <meta name="description"
        content="Register for Khachaak PhotoWalk 2026. Official Photography Club of NMIMS MPSTME.">
    <link rel="icon" type="image/png" href="/assets/logos/favicon.png">

    <!-- Open Graph / Meta -->
    <meta property="og:title" content="PhotoWalk 2026 Registration | Khachaak">
    <meta property="og:description"
        content="Register now for Khachaak PhotoWalk 2026! Limited spots available.">
    <meta property="og:image" content="/assets/logos/logo.webp">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- GridMotion & Page Styles -->
    <link rel="stylesheet" href="/css/GridMotion.css">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #05070a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>

<body>
    <!-- Animated Gallery Background (GridMotion) -->
    <div id="grid-motion-root"></div>

    <!-- Floating Navigation Badges -->
    <a href="/" class="photowalk-badge" title="Khachaak Home">
        <img src="/assets/logos/logo.webp" alt="Khachaak">
        <span>Khachaak</span>
    </a>

    <a href="/photowalk-t&c" class="photowalk-tc-badge" target="_blank" title="PhotoWalk 2026 Terms & Conditions">
        <span>Terms &amp; Conditions ↗</span>
    </a>

    <!-- Transparent Tally Form Embed -->
    <div class="tally-frame-wrapper">
        <iframe
            data-tally-src="https://tally.so/r/ODWXWa?transparentBackground=1"
            src="https://tally.so/r/ODWXWa?transparentBackground=1"
            loading="eager"
            width="100%"
            height="100%"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="PhotoWalk 2026 Registration">
        </iframe>
    </div>

    <!-- GSAP Animation Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <!-- GridMotion Logic -->
    <script src="/js/grid-motion.js"></script>

    <!-- Tally Embed Script -->
    <script>
        var d = document,
            w = "https://tally.so/widgets/embed.js",
            v = function () {
                "undefined" != typeof Tally ? Tally.loadEmbeds() : d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach((function (e) {
                    e.src = e.dataset.tallySrc
                }))
            };
        if ("undefined" != typeof Tally) v();
        else if (d.querySelector('script[src="' + w + '"]') == null) {
            var s = d.createElement("script");
            s.src = w, s.onload = v, s.onerror = v, d.body.appendChild(s);
        }
    </script>
</body>

</html>
